<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Cyber Pinball</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Audiowide&family=Bebas+Neue&family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>html,body{margin:0;background:var(--void)} body{padding:32px} </style></head>
<body class="cp-root">

<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:22px 12px">
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-play" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">play</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-tables" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">tables</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-plus" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">plus</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-search" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">search</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-download" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">download</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-list" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">list</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-update" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">update</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-user" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">user</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-chip" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">chip</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-image" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">image</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-sliders" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">sliders</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-cabinet" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">cabinet</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-sound" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">sound</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-desktop" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">desktop</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-power" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">power</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-pulse" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">pulse</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-gamepad" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">gamepad</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-info" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">info</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-book" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">book</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-rules" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">rules</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-eye" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">eye</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-edit" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">edit</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-trash" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">trash</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-check" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">check</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-alert" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">alert</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-close" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">close</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-chevron-right" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">chevron-right</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-chevron-left" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">chevron-left</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-monitor" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">monitor</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-flipper" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">flipper</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-start" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">start</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-exit" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">exit</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-coin" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">coin</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-plunger" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">plunger</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-folder" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">folder</span></div>
  <div style="display:grid;justify-items:center;gap:8px;color:var(--ink)"><i class="cp-i cp-i-usb" style="font-size:40px"></i><span style="font-size:20px;color:var(--ink-muted)">usb</span></div>
</div>
</body>
</html>
