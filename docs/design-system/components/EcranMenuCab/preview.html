<style>html,body{margin:0;background:var(--void)} body{padding:32px} body{padding:0} .scr{position:relative;overflow:hidden;background:var(--void)} .scr{background-color:var(--void)}.scr>.cp-hints{position:absolute;bottom:0;left:0;right:0}.topline{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--ink-muted)}.media{border-radius:6px}.section-heading{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line-strong);padding-bottom:16px;margin:0 0 8px}.section-heading .cp-label{color:var(--ink)}.screen-content{position:absolute;inset:48px 64px 116px}.cab-top{position:absolute;inset:0 0 auto;padding:44px 48px;background:var(--void);border-bottom:1px solid var(--line)}.system-link{display:flex;align-items:center;gap:12px;font-size:22px;color:var(--ink-muted)}.cab-bottom{position:absolute;inset:auto 0 100px;padding:64px 32px 16px;background:linear-gradient(0deg,var(--void) 87%,transparent)}.cab-heading{padding:0 32px 40px}.cab-heading h1{font-size:76px;line-height:1.1;margin:18px 0}.cab-heading .cp-meta{font-size:30px}.cab-heading p{font-size:24px;margin:14px 0 0}.cab-bottom .cp-count{margin:30px 0 0}.cab-bottom .cp-wheel{gap:8px}.cab-bottom .cp-logo{width:112px}.cab-bottom .cp-logo.near{width:138px}.cab-bottom .cp-logo.is-focus{width:220px}</style></head>
