<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Cyber Pinball</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="screen.css" />
  </head>
  <body>
    <main id="screen">
      <header class="top">
        <span class="brand">CYBER <span class="pin">PINBALL</span></span>
        <button class="quit" id="quit" type="button" data-act='{"type":"quit","op":"ask"}' hidden data-i18n>Quitter sans enregistrer</button>
      </header>
      <div class="content">
        <div class="number" id="number"></div>
        <div class="prompt" id="prompt"></div>
        <div class="measure" id="measure" hidden></div>
        <div class="name" id="name"></div>
        <div class="details" id="details"></div>
        <div class="gauge" id="gauge" hidden>
          <div class="gauge-label" id="gauge-label"></div>
          <div class="gauge-track"><span class="gauge-fill" id="gauge-fill"></span><span class="gauge-rest"></span><span class="gauge-peak" id="gauge-peak"></span></div>
          <div class="gauge-scale"><span data-i18n>Avant</span><span data-i18n>Repos</span><span data-i18n>Tiré à fond</span></div>
        </div>
        <ol class="buttons-list" id="buttons" hidden></ol>
        <div class="actions" id="actions" hidden></div>
        <section class="panel" id="panel" hidden></section>
        <section class="arrange" id="arrange" hidden></section>
      </div>
      <footer>
        <div class="notice" id="notice" hidden></div>
        <div class="step" id="step"></div>
        <div class="hint" id="hint"></div>
      </footer>
      <div class="edge" id="edge" hidden data-i18n>▼ FLIPPERS · VOUS ÊTES ICI ▼</div>
      <section class="quit-dialog" id="quit-dialog" hidden></section>
    </main>
    <div id="zones"></div>
    <div class="arrange-coach" id="arrange-coach" hidden></div>
    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="sound.js"></script>
    <script src="screen.js"></script>
  </body>
</html>
