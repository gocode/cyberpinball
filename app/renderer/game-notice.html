<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title data-i18n>Cyber Pinball — Invitation</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="fallback.css" />
    <link rel="stylesheet" href="game-notice.css" />
  </head>
  <body>
    <div id="frame" class="frame">
      <div id="notice" class="notice" hidden>
        <span class="notice-icon" id="icon"></span>
        <span class="notice-title" id="title"></span>
        <span class="notice-table"><span id="table"></span></span>
        <span class="notice-left" id="left"></span>
        <span class="notice-hint" id="hint"></span>
        <span class="notice-track"><span class="notice-fill"></span></span>
      </div>
      <div id="board" class="board" hidden>
        <div class="board-head"><span class="board-icon" id="board-icon"></span><span class="board-title" id="board-title"></span></div>
        <ol class="board-rows" id="board-rows"></ol>
      </div>
      <div id="dmd" class="dmd" hidden><div class="dmd-dots" id="dmd-dots"></div></div>
      <div id="line" class="line" role="status" hidden>
        <span class="line-icon" id="line-icon"></span>
        <span class="line-text"><span class="line-title" id="line-title"></span><span class="line-detail" id="line-detail"></span></span>
      </div>
      <div id="volume" class="volume" role="status" hidden>
        <span class="volume-icon" id="volume-icon"></span>
        <span class="volume-title" id="volume-title"></span>
        <span class="volume-value" id="volume-value"></span>
        <span class="volume-track"><span class="volume-fill"></span></span>
        <span class="volume-detail" id="volume-detail"></span>
      </div>
      <div id="wait" class="wait" hidden>
        <div class="wait-head"><span class="wait-icon" id="wait-icon"></span><span class="wait-title" id="wait-title"></span></div>
        <p class="wait-lead" id="wait-lead"></p>
        <p class="wait-note" id="wait-note"></p>
        <ol class="wait-rows" id="wait-rows"></ol>
      </div>
    </div>
    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="police-points.js"></script>
    <script src="fallback.js"></script>
    <script src="game-notice.js"></script>
  </body>
</html>
