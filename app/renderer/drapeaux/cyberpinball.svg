    <radialGradient id="cp-plateau" cx="0.3" cy="1" r="0.8"><stop offset="0" stop-color="#1c8f80" stop-opacity="0.45"/><stop offset="1" stop-color="#1c8f80" stop-opacity="0"/></radialGradient>
    <linearGradient id="cp-trail" x1="204.0" y1="289.9" x2="653.8" y2="-9.3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#36c9b4"/><stop offset=".6" stop-color="#1c8f80"/><stop offset="1" stop-color="#1c8f80" stop-opacity=".15"/></linearGradient>
    <linearGradient id="cp-coeur" x1="204.0" y1="289.9" x2="641.8" y2="-1.2" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a8f3e8"/><stop offset=".5" stop-color="#36c9b4"/><stop offset="1" stop-color="#36c9b4" stop-opacity="0"/></linearGradient>
