<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- Cyber Pinball : le drapeau d'un joueur sans pays. La bille comète de l'icône (icone.svg) sur son verre fumé, la traînée jusqu'au coin haut droit. -->
