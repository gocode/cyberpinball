<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Bille comète dans sa plaque : la plaque (lunette métal, filet vert signal, verre fumé) occupe tout le carré ; la traînée de la bille passe juste par-dessus la lunette et s'arrête dans le coin haut droit, sans en sortir. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7f5"/><stop offset="0.2" stop-color="#a3b1ae"/><stop offset="0.52" stop-color="#252f2d"/><stop offset="0.85" stop-color="#8a9a97"/><stop offset="1" stop-color="#dfe7e5"/>
    </linearGradient>
    <linearGradient id="verre" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#143630"/><stop offset="0.55" stop-color="#07110f"/><stop offset="1" stop-color="#030807"/>
    </linearGradient>
    <radialGradient id="plateau" cx="0.35" cy="1" r="0.8"><stop offset="0" stop-color="#1c8f80" stop-opacity="0.45"/><stop offset="1" stop-color="#1c8f80" stop-opacity="0"/></radialGradient>
    <linearGradient id="trail" x1="100" y1="156" x2="250" y2="8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#36c9b4"/><stop offset=".6" stop-color="#1c8f80"/><stop offset="1" stop-color="#1c8f80" stop-opacity=".15"/></linearGradient>
    <linearGradient id="coeur" x1="100" y1="156" x2="246" y2="12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a8f3e8"/><stop offset=".5" stop-color="#36c9b4"/><stop offset="1" stop-color="#36c9b4" stop-opacity="0"/></linearGradient>
    <radialGradient id="ball" cx=".29" cy=".22" r=".82"><stop stop-color="#e6f0ec"/><stop offset=".11" stop-color="#a5c8be"/><stop offset=".25" stop-color="#406e64"/><stop offset=".46" stop-color="#0c1a17"/><stop offset=".73" stop-color="#030807"/><stop offset=".9" stop-color="#0c1a17"/><stop offset="1" stop-color="#36c9b4"/></radialGradient>
    <linearGradient id="rim" x1="36" y1="79" x2="151" y2="219" gradientUnits="userSpaceOnUse"><stop stop-color="#e6f0ec"/><stop offset=".35" stop-color="#73988c"/><stop offset=".6" stop-color="#07110f"/><stop offset="1" stop-color="#36c9b4"/></linearGradient>
    <clipPath id="dedans"><rect x="22" y="22" width="212" height="212" rx="40"/></clipPath>
  </defs>
  <!-- Plaque. -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#metal)"/>
  <rect x="12" y="12" width="232" height="232" rx="49" fill="#030807"/>
  <rect x="18" y="18" width="220" height="220" rx="44" fill="none" stroke="#8be23a" stroke-width="5"/>
  <rect x="22" y="22" width="212" height="212" rx="40" fill="url(#verre)"/>
  <rect x="22" y="22" width="212" height="212" rx="40" fill="url(#plateau)"/>
  <path d="M22 150 L150 22 L184 22 L22 186 Z" fill="#ffffff" opacity="0.04" clip-path="url(#dedans)"/>
  <!-- Traînée, par-dessus la lunette : ombre sombre qui la détache, corps, cœur clair, éclat vert. -->
  <path d="M66 126 C120 99 186 45 249 7 C212 53 185 119 129 190 Z" fill="#030807" stroke="#030807" stroke-width="10" stroke-linejoin="round" opacity="0.85"/>
  <path d="M68 128 C122 101 188 47 247 9 C211 55 183 121 128 188 Z" fill="url(#trail)"/>
  <path d="M88 137 C134 109 194 59 241 15 C208 59 179 113 118 172 Z" fill="url(#coeur)"/>
  <path d="M181 79 L207 53" stroke="#8be23a" stroke-width="8" stroke-linecap="round"/>
  <!-- Bille noire chromée (celle de la bille comète). -->
  <g transform="translate(98 158) scale(.8) translate(-98 -152)">
    <circle cx="98" cy="152" r="80" fill="#030807"/>
    <circle cx="98" cy="152" r="75" fill="url(#ball)" stroke="url(#rim)" stroke-width="4"/>
    <path d="M40 141C40 110 62 91 88 91" stroke="#e6f0ec" stroke-opacity=".65" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="72" cy="116" rx="19" ry="12" transform="rotate(-38 72 116)" fill="#e6f0ec" fill-opacity=".84"/>
    <path d="M65 212C96 229 135 215 153 187" stroke="#36c9b4" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
