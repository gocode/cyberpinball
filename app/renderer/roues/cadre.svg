<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
<!-- Cadre de métal teinté vert (plateau et fronton, au bureau), posé en border-image : coins de
     32 × 32, bords étirés. Tranche de 16, sobre : arête sombre, chant clair, métal brossé,
     gorge, filet vert, lèvre. Reflets et halo : frontend.css (.menu-frame). -->
<defs>
  <linearGradient id="brosse" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9cc4b1"/><stop offset=".3" stop-color="#3e6253"/>
    <stop offset=".55" stop-color="#86ae9b"/><stop offset="1" stop-color="#34574a"/>
  </linearGradient>
</defs>
<rect x=".75" y=".75" width="158.5" height="158.5" rx="14" fill="none" stroke="#020806" stroke-width="1.5"/>
<rect x="2.25" y="2.25" width="155.5" height="155.5" rx="12.5" fill="none" stroke="#e9f8f0" stroke-width="1.5" opacity=".9"/>
<rect x="6.5" y="6.5" width="147" height="147" rx="9" fill="none" stroke="url(#brosse)" stroke-width="7"/>
<rect x="10.75" y="10.75" width="138.5" height="138.5" rx="6" fill="none" stroke="#06140f" stroke-width="1.5"/>
<rect x="12.75" y="12.75" width="134.5" height="134.5" rx="5" fill="none" stroke="#8be23a" stroke-width="1.5"/>
<rect x="14.75" y="14.75" width="130.5" height="130.5" rx="4" fill="none" stroke="#020806" stroke-width="2.5"/>
</svg>
