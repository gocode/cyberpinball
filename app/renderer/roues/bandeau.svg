<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
<!-- Roue Bandeau : lame de verre droite bordée de néon, les médaillons la débordent. Repère 1080 × 540 du bandeau ; image fixe, rien ne s'anime ici. -->
<defs>
  <filter id="halo" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="haloLarge" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="ombre" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="0">
    <stop offset="0" stop-color="#2ad1b6" stop-opacity=".25"/><stop offset=".22" stop-color="#2ad1b6"/>
    <stop offset=".5" stop-color="#5ff2d6"/><stop offset=".78" stop-color="#2ad1b6"/><stop offset="1" stop-color="#2ad1b6" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="filet" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="0">
    <stop offset="0" stop-color="#24504a" stop-opacity="0"/><stop offset=".2" stop-color="#2a8f80"/>
    <stop offset=".5" stop-color="#3ad0b8"/><stop offset=".8" stop-color="#2a8f80"/><stop offset="1" stop-color="#24504a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vert" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="780" y2="0">
    <stop offset="0" stop-color="#8be23a" stop-opacity="0"/><stop offset=".5" stop-color="#8be23a"/><stop offset="1" stop-color="#8be23a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f7f8"/><stop offset=".2" stop-color="#8d989c"/><stop offset=".45" stop-color="#e9eef0"/>
    <stop offset=".7" stop-color="#5b666b"/><stop offset="1" stop-color="#d5dde0"/>
  </linearGradient>
  <linearGradient id="pied" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#030807" stop-opacity="0"/><stop offset=".45" stop-color="#030807" stop-opacity=".82"/><stop offset="1" stop-color="#010403" stop-opacity=".96"/>
  </linearGradient>
  <radialGradient id="lueur"><stop offset="0" stop-color="#8be23a" stop-opacity=".42"/><stop offset=".45" stop-color="#8be23a" stop-opacity=".14"/><stop offset="1" stop-color="#8be23a" stop-opacity="0"/></radialGradient>
  <pattern id="trame" width="18" height="31.2" patternUnits="userSpaceOnUse">
    <path d="M9 0 L18 5.2 L18 15.6 L9 20.8 L0 15.6 L0 5.2 Z M9 20.8 L9 31.2" fill="none" stroke="#3ad0b8" stroke-width=".7" opacity=".1"/>
  </pattern>
</defs>
<rect y="300" width="1080" height="240" fill="url(#pied)"/>
<path d="M 40,478 H 1040" stroke="url(#filet)" stroke-width="1.2" opacity=".7"/>
<rect x="-10" y="78" width="1100" height="164" fill="#041310" opacity=".82"/>
<rect x="-10" y="78" width="1100" height="164" fill="url(#trame)"/>
<rect x="-10" y="78" width="1100" height="70" fill="#bff7ea" opacity=".04"/>
<g filter="url(#ombre)" fill="#000" opacity=".7"><ellipse cx="125" cy="250" rx="80" ry="16"/><ellipse cx="330" cy="256" rx="90" ry="18"/><ellipse cx="750" cy="256" rx="90" ry="18"/><ellipse cx="955" cy="250" rx="80" ry="16"/></g>
<ellipse cx="540" cy="160" rx="250" ry="140" fill="url(#lueur)"/>
<path d="M -10,78 H 1090" fill="none" stroke="#1c8f80" stroke-width="12" filter="url(#haloLarge)" opacity=".85"/>
<path d="M -10,78 H 1090" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#halo)"/>
<path d="M -10,78 H 1090" fill="none" stroke="url(#neon)" stroke-width="2.2"/>
<path d="M -10,78 H 1090" fill="none" stroke="#e6fff9" stroke-width=".9" opacity=".8"/>
<path d="M -10,78 H 1090" fill="none" stroke="#f2fffb" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0 120 60 260 30 300 60 260 30 2000" filter="url(#halo)"/>
<path d="M -10,78 H 1090" fill="none" stroke="#f2fffb" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 120 60 260 30 300 60 260 30 2000"/>
<path d="M -10,242 H 1090" fill="none" stroke="#1c8f80" stroke-width="12" filter="url(#haloLarge)" opacity=".85"/>
<path d="M -10,242 H 1090" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#halo)"/>
<path d="M -10,242 H 1090" fill="none" stroke="url(#neon)" stroke-width="2.2"/>
<path d="M -10,242 H 1090" fill="none" stroke="#e6fff9" stroke-width=".9" opacity=".8"/>
<path d="M -10,242 H 1090" fill="none" stroke="#f2fffb" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0 200 40 600 40 2000" filter="url(#halo)"/>
<path d="M -10,242 H 1090" fill="none" stroke="#f2fffb" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 200 40 600 40 2000"/>
<path d="M -10,90 H 1090 M -10,230 H 1090" stroke="url(#filet)" stroke-width="1" opacity=".5"/>
<g stroke="#5ff2d6" stroke-width="3" fill="none" filter="url(#halo)"><path d="M 14,96 V 224 M 1066,96 V 224"/></g>
<path d="M 340,262 H 740" stroke="url(#vert)" stroke-width="2" filter="url(#halo)"/>
</svg>
