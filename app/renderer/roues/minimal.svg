<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
<!-- Roue Minimaliste : un filet lumineux sous les médaillons, la table reste dégagée. Repère 1080 × 540 du bandeau ; image fixe, rien ne s'anime ici. -->
<defs>
  <filter id="halo" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="haloLarge" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="ombre" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="0">
    <stop offset="0" stop-color="#2ad1b6" stop-opacity=".25"/><stop offset=".22" stop-color="#2ad1b6"/>
    <stop offset=".5" stop-color="#5ff2d6"/><stop offset=".78" stop-color="#2ad1b6"/><stop offset="1" stop-color="#2ad1b6" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="filet" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="0">
    <stop offset="0" stop-color="#24504a" stop-opacity="0"/><stop offset=".2" stop-color="#2a8f80"/>
    <stop offset=".5" stop-color="#3ad0b8"/><stop offset=".8" stop-color="#2a8f80"/><stop offset="1" stop-color="#24504a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vert" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="780" y2="0">
    <stop offset="0" stop-color="#8be23a" stop-opacity="0"/><stop offset=".5" stop-color="#8be23a"/><stop offset="1" stop-color="#8be23a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f7f8"/><stop offset=".2" stop-color="#8d989c"/><stop offset=".45" stop-color="#e9eef0"/>
    <stop offset=".7" stop-color="#5b666b"/><stop offset="1" stop-color="#d5dde0"/>
  </linearGradient>
  <linearGradient id="pied" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#030807" stop-opacity="0"/><stop offset=".45" stop-color="#030807" stop-opacity=".82"/><stop offset="1" stop-color="#010403" stop-opacity=".96"/>
  </linearGradient>
  <radialGradient id="lueur"><stop offset="0" stop-color="#8be23a" stop-opacity=".42"/><stop offset=".45" stop-color="#8be23a" stop-opacity=".14"/><stop offset="1" stop-color="#8be23a" stop-opacity="0"/></radialGradient>
  <pattern id="trame" width="18" height="31.2" patternUnits="userSpaceOnUse">
    <path d="M9 0 L18 5.2 L18 15.6 L9 20.8 L0 15.6 L0 5.2 Z M9 20.8 L9 31.2" fill="none" stroke="#3ad0b8" stroke-width=".7" opacity=".1"/>
  </pattern>
</defs>
<rect y="300" width="1080" height="240" fill="url(#pied)"/>
<path d="M 40,478 H 1040" stroke="url(#filet)" stroke-width="1.2" opacity=".7"/>
<ellipse cx="540" cy="190" rx="620" ry="150" fill="#030807" opacity=".55" filter="url(#ombre)"/>
<g filter="url(#ombre)" fill="#000" opacity=".7"><ellipse cx="135" cy="258" rx="70" ry="14"/><ellipse cx="330" cy="262" rx="80" ry="16"/><ellipse cx="750" cy="262" rx="80" ry="16"/><ellipse cx="945" cy="258" rx="70" ry="14"/></g>
<ellipse cx="540" cy="170" rx="230" ry="130" fill="url(#lueur)"/>
<path d="M 60,282 H 1020" fill="none" stroke="#1c8f80" stroke-width="12" filter="url(#haloLarge)" opacity=".85"/>
<path d="M 60,282 H 1020" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#halo)"/>
<path d="M 60,282 H 1020" fill="none" stroke="url(#neon)" stroke-width="2.2"/>
<path d="M 60,282 H 1020" fill="none" stroke="#e6fff9" stroke-width=".9" opacity=".8"/>
<path d="M 60,282 H 1020" fill="none" stroke="#f2fffb" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0 160 50 500 50 2000" filter="url(#halo)"/>
<path d="M 60,282 H 1020" fill="none" stroke="#f2fffb" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 160 50 500 50 2000"/>
<path d="M 380,282 H 700" stroke="#8be23a" stroke-width="3" filter="url(#halo)"/><path d="M 420,282 H 660" stroke="#c9ff8a" stroke-width="1.5"/>
<g fill="none" stroke="#8be23a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 30,144 L 12,170 L 30,196" filter="url(#halo)" opacity=".9"/><path d="M 30,144 L 12,170 L 30,196"/>
  <path d="M 1050,144 L 1068,170 L 1050,196" filter="url(#halo)" opacity=".9"/><path d="M 1050,144 L 1068,170 L 1050,196"/>
</g>
<g fill="none" stroke="#2ad1b6" stroke-width="2.5" stroke-linecap="round" opacity=".8">
  <path d="M 60,392 H 190 L 220,362" filter="url(#halo)"/><path d="M 60,392 H 190 L 220,362"/>
  <path d="M 1020,392 H 890 L 860,362" filter="url(#halo)"/><path d="M 1020,392 H 890 L 860,362"/>
</g>
</svg>
