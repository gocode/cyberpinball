<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
<!-- Bandeau de la roue Médaillons (repère 1080 × 540) : verre fumé sous un arc éclairé au
     néon, second arc sous les médaillons, ombres des places, plaque du titre et flèches.
     Image fixe : les flous sont calculés une fois, rien ne s'anime ici. -->
<defs>
  <filter id="halo" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="haloLarge" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="ombre" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="verre" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a2620" stop-opacity=".62"/>
    <stop offset=".18" stop-color="#041310" stop-opacity=".84"/>
    <stop offset=".55" stop-color="#020907" stop-opacity=".94"/>
    <stop offset="1" stop-color="#010403" stop-opacity=".98"/>
  </linearGradient>
  <linearGradient id="reflet" x1="0" y1="0" x2="1" y2=".35">
    <stop offset="0" stop-color="#bff7ea" stop-opacity="0"/>
    <stop offset=".3" stop-color="#bff7ea" stop-opacity="0"/>
    <stop offset=".42" stop-color="#bff7ea" stop-opacity=".07"/>
    <stop offset=".5" stop-color="#bff7ea" stop-opacity=".02"/>
    <stop offset=".62" stop-color="#bff7ea" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="0">
    <stop offset="0" stop-color="#2ad1b6" stop-opacity=".25"/>
    <stop offset=".22" stop-color="#2ad1b6"/>
    <stop offset=".5" stop-color="#5ff2d6"/>
    <stop offset=".78" stop-color="#2ad1b6"/>
    <stop offset="1" stop-color="#2ad1b6" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="filet" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="0">
    <stop offset="0" stop-color="#24504a" stop-opacity="0"/>
    <stop offset=".2" stop-color="#2a8f80"/>
    <stop offset=".5" stop-color="#3ad0b8"/>
    <stop offset=".8" stop-color="#2a8f80"/>
    <stop offset="1" stop-color="#24504a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vert" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="880" y2="0">
    <stop offset="0" stop-color="#8be23a" stop-opacity=".2"/>
    <stop offset=".25" stop-color="#8be23a"/>
    <stop offset=".75" stop-color="#8be23a"/>
    <stop offset="1" stop-color="#8be23a" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d2a1c"/>
    <stop offset=".5" stop-color="#04110b"/>
    <stop offset="1" stop-color="#071a12"/>
  </linearGradient>
  <pattern id="trame" width="18" height="31.2" patternUnits="userSpaceOnUse">
    <path d="M9 0 L18 5.2 L18 15.6 L9 20.8 L0 15.6 L0 5.2 Z M9 20.8 L9 31.2" fill="none" stroke="#3ad0b8" stroke-width=".7"/>
  </pattern>
  <linearGradient id="trameFondu" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".4" stop-color="#fff" stop-opacity=".09"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
  </linearGradient>
  <mask id="trameMasque"><rect width="1080" height="540" fill="url(#trameFondu)"/></mask>
  <radialGradient id="lueur">
    <stop offset="0" stop-color="#8be23a" stop-opacity=".42"/>
    <stop offset=".45" stop-color="#8be23a" stop-opacity=".14"/>
    <stop offset="1" stop-color="#8be23a" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Corps de verre sous l'arc, trame hexagonale à peine visible, reflet oblique. -->
<path id="corps" d="M -20,150 Q 540,-10 1100,150 L 1100,540 L -20,540 Z" fill="url(#verre)"/>
<path d="M -20,150 Q 540,-10 1100,150 L 1100,540 L -20,540 Z" fill="url(#trame)" mask="url(#trameMasque)"/>
<path d="M -20,150 Q 540,-10 1100,150 L 1100,540 L -20,540 Z" fill="url(#reflet)"/>

<!-- Ombres portées des places (fixes) et lueur verte sous la table choisie. -->
<g filter="url(#ombre)" fill="#000" opacity=".7">
  <ellipse cx="112" cy="282" rx="62" ry="12"/><ellipse cx="968" cy="282" rx="62" ry="12"/>
  <ellipse cx="222" cy="266" rx="70" ry="13"/><ellipse cx="858" cy="266" rx="70" ry="13"/>
  <ellipse cx="352" cy="256" rx="78" ry="14"/><ellipse cx="728" cy="256" rx="78" ry="14"/>
</g>
<ellipse cx="540" cy="168" rx="250" ry="150" fill="url(#lueur)"/>

<!-- Arc supérieur : halo large, halo serré, cœur clair. -->
<path d="M -20,150 Q 540,-10 1100,150" fill="none" stroke="#1c8f80" stroke-width="14" filter="url(#haloLarge)" opacity=".9"/>
<path d="M -20,150 Q 540,-10 1100,150" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#halo)"/>
<path d="M -20,150 Q 540,-10 1100,150" fill="none" stroke="url(#neon)" stroke-width="2.4"/>
<path d="M -20,150 Q 540,-10 1100,150" fill="none" stroke="#e6fff9" stroke-width=".9" opacity=".85"/>
<!-- Traits de lumière le long de l'arc. -->
<path d="M -20,150 Q 540,-10 1100,150" fill="none" stroke="#f2fffb" stroke-width="3.5" stroke-linecap="round"
      stroke-dasharray="0 150 46 230 22 310 46 220 22 2000" filter="url(#halo)"/>
<path d="M -20,150 Q 540,-10 1100,150" fill="none" stroke="#f2fffb" stroke-width="2" stroke-linecap="round"
      stroke-dasharray="0 150 46 230 22 310 46 220 22 2000"/>
<!-- Filet intérieur, parallèle, plus discret. -->
<path d="M -20,172 Q 540,14 1100,172" fill="none" stroke="url(#filet)" stroke-width="1.2" opacity=".55"/>

<!-- Arc inférieur, sous les médaillons. -->
<path d="M -20,330 Q 540,222 1100,330" fill="none" stroke="#1c8f80" stroke-width="10" filter="url(#haloLarge)" opacity=".7"/>
<path d="M -20,330 Q 540,222 1100,330" fill="none" stroke="url(#neon)" stroke-width="2.6" filter="url(#halo)"/>
<path d="M -20,330 Q 540,222 1100,330" fill="none" stroke="url(#neon)" stroke-width="1.6"/>
<path d="M -20,330 Q 540,222 1100,330" fill="none" stroke="#f2fffb" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="0 120 34 640 34 2000" filter="url(#halo)"/>
<path d="M -20,346 Q 540,240 1100,346" fill="none" stroke="url(#filet)" stroke-width="1" opacity=".4"/>

<!-- Flèches de la roue. -->
<g fill="none" stroke="#8be23a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 30,186 L 12,212 L 30,238" filter="url(#halo)" opacity=".9"/>
  <path d="M 30,186 L 12,212 L 30,238"/>
  <path d="M 1050,186 L 1068,212 L 1050,238" filter="url(#halo)" opacity=".9"/>
  <path d="M 1050,186 L 1068,212 L 1050,238"/>
</g>
<!-- Repère au-dessus de la table choisie. -->
<path d="M 528,-2 L 552,-2 L 540,12 Z" fill="#8be23a"/>
<path d="M 528,-2 L 552,-2 L 540,12 Z" fill="#8be23a" filter="url(#halo)"/>

<!-- Plaque du titre : biseaux, liseré vert lumineux, chevrons de côté. -->
<path d="M 252,352 L 828,352 L 858,382 L 858,430 L 828,460 L 252,460 L 222,430 L 222,382 Z" fill="#000" opacity=".55" filter="url(#ombre)"/>
<path d="M 252,352 L 828,352 L 858,382 L 858,430 L 828,460 L 252,460 L 222,430 L 222,382 Z" fill="url(#plaque)"/>
<path d="M 252,352 L 828,352 L 858,382 L 858,430 L 828,460 L 252,460 L 222,430 L 222,382 Z" fill="none" stroke="url(#vert)" stroke-width="4" filter="url(#halo)" opacity=".8"/>
<path d="M 252,352 L 828,352 L 858,382 L 858,430 L 828,460 L 252,460 L 222,430 L 222,382 Z" fill="none" stroke="url(#vert)" stroke-width="2"/>
<path d="M 260,362 L 820,362 L 846,388 L 846,424 L 820,450 L 260,450 L 234,424 L 234,388 Z" fill="none" stroke="#3ad0b8" stroke-width="1" opacity=".35"/>
<path d="M 400,352 L 680,352" stroke="#d9ffb0" stroke-width="2.5" filter="url(#halo)"/>
<g fill="none" stroke="#8be23a" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 206,384 L 186,406 L 206,428" stroke-width="5" filter="url(#halo)"/>
  <path d="M 206,384 L 186,406 L 206,428" stroke-width="4"/>
  <path d="M 874,384 L 894,406 L 874,428" stroke-width="5" filter="url(#halo)"/>
  <path d="M 874,384 L 894,406 L 874,428" stroke-width="4"/>
</g>

<!-- Séparation de la barre d'aide. -->
<path d="M 40,478 H 1040" stroke="url(#filet)" stroke-width="1.2" opacity=".7"/>
<path d="M 40,478 H 160" stroke="#5ff2d6" stroke-width="2" filter="url(#halo)"/>
<path d="M 920,478 H 1040" stroke="#5ff2d6" stroke-width="2" filter="url(#halo)"/>
</svg>
