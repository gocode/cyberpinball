<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Intérieur du médaillon Communauté (12/11/2026), posé dans l'anneau chromé commun des médaillons
       (docs/design-system/src/medaillons.cjs) : même disque sarcelle et même lumière d'en haut à gauche
       que le Juke-box ; un globe bleu méta en filigrane (les salons par pays, le monde), trois joueurs devant lui,
       celui du centre en vert signal, ses deux voisins en violet derrière lui (choix du mainteneur, 12/11/2026). -->
  <defs>
    <radialGradient id="cm-disc" cx="30%" cy="24%" r="82%"><stop stop-color="#173c3c"/><stop offset="1" stop-color="#06100f"/></radialGradient>
    <linearGradient id="cm-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0d6cb"/><stop offset=".38" stop-color="#8ba69e"/><stop offset="1" stop-color="#506e67"/></linearGradient>
    <radialGradient id="cm-glow" cx="50%" cy="58%" r="50%"><stop stop-color="#35c8bd" stop-opacity=".22"/><stop offset="1" stop-color="#35c8bd" stop-opacity="0"/></radialGradient>
    <clipPath id="cm-globe"><circle cx="150" cy="150" r="104"/></clipPath>
  </defs>
  <circle cx="150" cy="150" r="147" fill="url(#cm-disc)" stroke="url(#cm-metal)" stroke-width="6"/>
  <g fill="none" stroke="#719b9b"><circle cx="150" cy="150" r="134" opacity=".42"/><circle cx="150" cy="150" r="124" opacity=".26"/></g>
  <path d="M51.7 68.7A127.5 127.5 0 0 1 172.1 24.4" stroke="#c0d6cb" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".83"/>
  <!-- Globe : méridiens et parallèles en bleu méta, discrets. -->
  <circle cx="150" cy="150" r="104" fill="url(#cm-glow)"/>
  <g clip-path="url(#cm-globe)" fill="none" stroke="#5fb4cf" stroke-width="3" opacity=".6">
    <circle cx="150" cy="150" r="104"/>
    <ellipse cx="150" cy="150" rx="62" ry="104"/>
    <ellipse cx="150" cy="150" rx="22" ry="104"/>
    <path d="M46 150h208M58 98h184M58 202h184"/>
  </g>
  <!-- Deux joueurs en retrait, violets. -->
  <g fill="#aa84dc">
    <circle cx="96" cy="138" r="19"/>
    <path d="M60 206c0-26 16-42 36-42s36 16 36 42z"/>
    <circle cx="204" cy="138" r="19"/>
    <path d="M168 206c0-26 16-42 36-42s36 16 36 42z"/>
  </g>
  <!-- Le joueur du centre, devant, vert signal, détaché par un liseré du fond. -->
  <g fill="#8be23a" stroke="#0a1a19" stroke-width="7" paint-order="stroke">
    <circle cx="150" cy="124" r="26"/>
    <path d="M100 222c0-36 22-58 50-58s50 22 50 58z"/>
  </g>
</svg>
