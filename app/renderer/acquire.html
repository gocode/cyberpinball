<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title data-i18n>Récupérer</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="acquire.css" />
  </head>
  <body>
    <div class="frame">
      <header class="bar">
        <div class="what">
          <div class="line"><span class="brand" data-i18n>RÉCUPÉRER</span><span class="game" id="game"></span></div>
          <div class="line"><span class="expected" id="expected"></span><span class="host" id="host"></span></div>
          <div class="status" id="status"></div>
          <div class="screen-note" id="screen-note" hidden></div>
        </div>
        <aside class="remote" id="remote" hidden>
          <canvas class="qr" id="remote-qr" hidden></canvas>
          <div class="remote-code" id="remote-code" hidden></div>
          <span class="remote-mark" id="remote-mark" hidden></span>
          <div class="remote-text">
            <div class="remote-title" id="remote-title"></div>
            <div class="remote-line" id="remote-line"></div>
          </div>
          <div class="remote-actions" id="remote-actions" hidden>
            <button type="button" id="remote-accept" class="accept" data-i18n>Accepter (Start)</button>
            <button type="button" id="remote-refuse" data-i18n>Refuser (Exit)</button>
            <button type="button" id="remote-end" data-i18n>Déconnecter</button>
          </div>
        </aside>
        <nav class="buttons">
          <button type="button" id="back" data-i18n>← Précédent</button>
          <button type="button" id="home" data-i18n="Retour à la fiche (page du fichier sur le site)">Retour à la fiche</button>
          <button type="button" id="browser" data-i18n>Ouvrir dans mon navigateur</button>
          <button type="button" id="close" class="close" data-i18n>Fermer (Échap)</button>
        </nav>
      </header>
      <form class="search" id="search" hidden>
        <div class="engines" id="engines" role="radiogroup"></div>
        <input type="search" id="query" autocomplete="off" spellcheck="false" />
        <button type="submit" class="go" data-i18n>Chercher</button>
      </form>
      <div class="video" id="video" hidden>
        <span class="video-mark" aria-hidden="true">▶</span>
        <span class="video-text" id="video-text"></span>
        <span class="video-hint" id="video-hint"></span>
        <button type="button" id="video-get" hidden data-i18n>Télécharger cette vidéo</button>
        <button type="button" id="grab-audio" class="grab" hidden data-i18n>Récupérer le son</button>
        <button type="button" id="grab-video" class="grab" hidden data-i18n>Récupérer la vidéo</button>
      </div>
      <div class="video jukebox" id="jukebox" hidden>
        <span class="video-mark" aria-hidden="true">♪</span>
        <span class="video-text" id="jukebox-text"></span>
        <button type="button" id="jukebox-add" class="primary" data-i18n>Ajouter au Juke-box</button>
      </div>
      <section class="downloads" id="downloads" hidden></section>

    </div>
    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="acquire.js"></script>
  </body>
</html>
