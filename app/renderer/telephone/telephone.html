<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#030807" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <!-- Raccourci sur l'écran d'accueil : plein écran sur iPhone, icône de Cyber Pinball partout.
         Pas de manifeste : son adresse de départ perdrait la clé du téléphone gardé (#g=…), et
         l'iPhone donne à l'application de l'écran d'accueil un stockage à part. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cyber Pinball" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="application-name" content="Cyber Pinball" />
    <link rel="apple-touch-icon" sizes="180x180" href="icone-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icone-192.png" />
    <title data-i18n>Télécommande de la borne</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="telephone.css" />
  </head>
  <!-- Page du téléphone qui pilote la borne (telephone.js) ; servie par la borne sur le réseau
       local (app/src/phone-remote.ts). États : body[data-state] ; ce que la borne montre :
       body[data-mode] (browser : le navigateur intégré, menu : le menu, game : une partie). -->
  <body data-state="connecting" data-mode="browser">
    <!-- Une seule barre en haut : la marque (ou le retour d'un fil), ce que montre la borne (ou la vue),
         l'état de la liaison, « Clavier » quand la borne attend une saisie, et le menu ⋮. -->
    <header class="top">
      <button type="button" class="top-back" id="top-back" hidden></button>
      <span class="top-mark" id="top-mark" aria-hidden="true"></span>
      <section class="page" id="page" aria-live="polite">
        <span class="brand" aria-label="Cyber Pinball">CYBER <b>PINBALL</b></span>
        <span class="page-title" id="page-title"></span>
        <span class="page-host" id="page-host"></span>
      </section>
      <div class="link" id="link" role="status"><span class="dot" aria-hidden="true"></span><span class="link-text" id="link-text" data-i18n>Connexion…</span></div>
      <button type="button" class="top-keys" id="top-keys" aria-controls="keys" hidden></button>
      <button type="button" class="top-more" id="top-more" aria-controls="sheet" aria-haspopup="dialog"></button>
    </header>

    <main class="stage">
      <div class="message" id="message">
        <span class="message-mark" id="message-mark" aria-hidden="true"></span>
        <div class="code" id="code" hidden></div>
        <h1 class="message-title" id="message-title" data-i18n>Connexion à la borne…</h1>
        <p class="message-text" id="message-text"></p>
        <button type="button" class="key wide primary message-action" id="message-action" hidden data-i18n>Reprendre</button>
      </div>
      <!-- Juke-box : le lecteur de la borne (telephone-jukebox.js). « Écouter » (playlists, morceaux) ou
           « Gérer » (la gestion s'ouvre à la borne, ses entrées dans Écran) ; le lecteur déplié en plein écran. -->
      <section class="jukebox" id="jukebox" role="tabpanel" aria-labelledby="tab-jukebox">
        <div class="seg jb-seg" id="jb-seg">
          <button type="button" class="seg-tab" id="jb-listen" aria-selected="true"></button>
          <button type="button" class="seg-tab" id="jb-manage"></button>
        </div>
        <div class="jb-head" id="jb-head">
          <button type="button" class="jb-up" id="jb-up" hidden></button>
          <span class="jb-head-text"><span class="jb-title" id="jb-title"></span><span class="jb-label" id="jb-label"></span></span>
        </div>
        <div class="jb-acts" id="jb-acts"></div>
        <ul class="entry-list jb-list" id="jb-list"></ul>
        <div class="empty" id="jb-empty" hidden>
          <span class="empty-mark" id="jb-empty-mark" aria-hidden="true"></span>
          <p class="empty-title" id="jb-empty-title"></p>
          <p class="empty-text" id="jb-empty-text"></p>
          <button type="button" class="key wide primary" id="jb-open" hidden></button>
        </div>
      </section>
      <section class="jb-player" id="jb-player" aria-live="polite">
        <div class="jb-cover" id="jb-cover"></div>
        <div class="jb-now"><span class="jb-now-title" id="jb-now-title"></span><span class="jb-now-artist" id="jb-now-artist"></span></div>
        <div class="jb-track">
          <input type="range" id="jb-seek" min="0" max="1000" value="0" />
          <div class="jb-times"><span id="jb-elapsed"></span><span id="jb-total"></span></div>
        </div>
        <div class="jb-controls">
          <button type="button" class="jb-ctl small" id="jb-shuffle"></button>
          <button type="button" class="jb-ctl" id="jb-prev"></button>
          <button type="button" class="jb-ctl big" id="jb-pause"></button>
          <button type="button" class="jb-ctl" id="jb-next"></button>
          <button type="button" class="jb-ctl small" id="jb-repeat"></button>
        </div>
      </section>
      <!-- Communauté : Messages, Amis et Scores, sous un même onglet (telephone-community.js). -->
      <div class="seg" id="community-seg" role="tablist">
        <button type="button" class="seg-tab" id="seg-messages" role="tab" data-view="messages"></button>
        <button type="button" class="seg-tab" id="seg-friends" role="tab" data-view="friends"></button>
        <button type="button" class="seg-tab" id="seg-ranks" role="tab" data-view="ranks"></button>
      </div>
      <section class="community" id="community" role="tabpanel">
        <ul class="entry-list conv-list" id="conv-list"></ul>
        <div class="empty" id="conv-empty" hidden>
          <span class="empty-mark" id="conv-empty-mark" aria-hidden="true"></span>
          <p class="empty-title" id="conv-empty-title"></p>
          <p class="empty-text" id="conv-empty-text"></p>
        </div>
      </section>
      <!-- Le fil d'un ami, plein écran : jours, évènements, bulles des deux côtés ; réponses d'un appui et champ en bas. -->
      <section class="thread" id="thread" aria-live="polite">
        <ol class="thread-lines" id="thread-lines"></ol>
        <p class="thread-status" id="thread-status"></p>
        <div class="thread-chips" id="thread-chips"></div>
        <form class="thread-form" id="thread-form" autocomplete="off">
          <input type="text" id="thread-field" maxlength="500" autocomplete="off" enterkeyhint="send" />
          <button type="submit" class="thread-send" id="thread-send"></button>
        </form>
      </section>
      <section class="entries" id="entries" role="tabpanel" aria-labelledby="tab-list">
        <!-- Menu des tables : la collection affichée (à choisir, comme MagnaSave à la borne) et liste / grille. -->
        <div class="entries-tools" id="entries-tools" hidden>
          <button type="button" class="coll-select" id="coll-select" aria-haspopup="dialog">
            <span class="coll-lab" id="coll-lab"></span>
            <span class="coll-name" id="coll-name"></span>
            <span class="coll-count" id="coll-count"></span>
            <span class="coll-go" id="coll-go" aria-hidden="true"></span>
          </button>
          <button type="button" class="grid-toggle" id="grid-toggle"></button>
        </div>
        <p class="entries-note" id="entries-note"></p>
        <ul class="entry-list" id="entries-list"></ul>
        <div class="empty" id="entries-empty" hidden>
          <span class="empty-mark" id="entries-empty-mark" aria-hidden="true"></span>
          <p class="empty-title" id="entries-empty-title"></p>
          <p class="empty-text" id="entries-empty-text"></p>
        </div>
      </section>
      <section class="menus" id="menus" role="tabpanel" aria-labelledby="tab-menus">
        <div class="menus-head" id="menus-head">
          <button type="button" class="menus-up" id="menus-up"></button>
          <span class="menus-trail" id="menus-trail"></span>
        </div>
        <ul class="entry-list" id="menus-list"></ul>
        <div class="empty" id="menus-empty" hidden>
          <span class="empty-mark" id="menus-empty-mark" aria-hidden="true"></span>
          <p class="empty-title" id="menus-empty-title"></p>
          <p class="empty-text" id="menus-empty-text"></p>
        </div>
      </section>
      <!-- Scores : la table (choisie ou lancée à la borne, ou une autre de la liste), ses portées et ses
           périodes, puis le tableau en grille commune, comme à la borne. -->
      <section class="ranks" id="ranks" role="tabpanel" aria-labelledby="tab-ranks">
        <button type="button" class="ranks-table" id="ranks-table" aria-expanded="false" aria-controls="ranks-picker">
          <span class="ranks-table-mark" id="ranks-table-mark" aria-hidden="true"></span>
          <span class="ranks-table-text">
            <span class="ranks-table-title" id="ranks-table-title"></span>
            <span class="ranks-table-detail" id="ranks-table-detail"></span>
          </span>
          <span class="ranks-table-go" id="ranks-table-go" aria-hidden="true"></span>
        </button>
        <div class="ranks-scroll" id="ranks-scroll">
          <div class="ranks-scopes" id="ranks-scopes" role="tablist"></div>
          <div class="ranks-periods" id="ranks-periods" role="tablist"></div>
          <ol class="ranks-lines" id="ranks-lines" data-aligned></ol>
          <div class="empty" id="ranks-empty" hidden>
            <span class="empty-mark" id="ranks-empty-mark" aria-hidden="true"></span>
            <p class="empty-title" id="ranks-empty-title"></p>
            <p class="empty-text" id="ranks-empty-text"></p>
          </div>
          <p class="ranks-position" id="ranks-position" hidden></p>
          <div class="ranks-foot" id="ranks-foot" hidden>
            <p class="ranks-note" id="ranks-note"></p>
            <p class="ranks-legend" id="ranks-legend"></p>
          </div>
        </div>
        <div class="ranks-picker" id="ranks-picker" hidden>
          <input class="ranks-filter" id="ranks-filter" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" hidden />
          <ul class="entry-list" id="ranks-tables"></ul>
          <div class="empty" id="ranks-tables-empty" hidden>
            <span class="empty-mark" id="ranks-tables-empty-mark" aria-hidden="true"></span>
            <p class="empty-title" id="ranks-tables-empty-title"></p>
            <p class="empty-text" id="ranks-tables-empty-text"></p>
          </div>
        </div>
      </section>
      <div class="buttons" id="buttons" role="tabpanel" aria-labelledby="tab-buttons">
        <button type="button" class="btn btn-start" data-b="confirm"></button>
        <button type="button" class="btn btn-flip" data-b="previous"></button>
        <button type="button" class="btn btn-flip" data-b="next"></button>
        <button type="button" class="btn btn-exit" data-b="exit"></button>
        <button type="button" class="btn btn-zone" data-b="zone"></button>
      </div>
      <div class="game-note" id="game-note">
        <span class="message-mark" id="game-mark" aria-hidden="true"></span>
        <h1 class="message-title" data-i18n>Partie en cours</h1>
        <p class="message-text" data-i18n>Les commandes reviennent à la fin de la partie.</p>
        <!-- Les réglages en partie, comme les deux MagnaSave : grisé avec sa raison quand ils ne s'ouvrent pas. -->
        <button type="button" class="key wide game-open" id="game-open" hidden></button>
        <p class="game-reason" id="game-reason" hidden></p>
        <!-- Messagerie pendant la partie : le fil le plus récent, des réactions et des phrases d'un appui,
             un champ ; rien ne passe par les boutons de la borne, qui restent à VPX. -->
        <section class="phone-chat" id="phone-chat" hidden>
          <h2 class="phone-chat-name" id="phone-chat-name"></h2>
          <ol class="phone-chat-lines" id="phone-chat-lines"></ol>
          <div class="phone-chat-chips" id="phone-chat-chips"></div>
          <form class="phone-chat-form" id="phone-chat-form">
            <input type="text" id="phone-chat-field" maxlength="500" autocomplete="off" enterkeyhint="send">
            <button type="submit" class="key phone-chat-send" id="phone-chat-send"></button>
          </form>
        </section>
      </div>
      <div class="pad" id="pad">
        <div class="pad-hint" id="pad-hint">
          <span data-i18n>Glissez pour déplacer le pointeur</span>
          <span data-i18n>Touchez pour cliquer</span>
          <span data-i18n>Deux doigts pour défiler</span>
          <span data-i18n>Appui long pour le clic droit</span>
        </div>
      </div>
    </main>

    <form class="keys" id="keys" hidden autocomplete="off">
      <div class="keys-head">
        <label class="field-label" id="field-label" for="field"></label>
        <button type="button" class="ghost" id="keys-hide" data-i18n>Masquer</button>
        <span class="field-mark" id="field-mark" hidden></span>
      </div>
      <div class="field-row">
        <input id="field" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" />
        <button type="button" class="key" id="key-backspace"></button>
      </div>
      <div class="key-row">
        <button type="button" class="key wide" id="key-tab" data-i18n>Champ suivant</button>
        <button type="button" class="key wide" id="key-cancel" data-i18n>Annuler</button>
        <button type="submit" class="key wide primary" id="key-enter" data-i18n>Entrée</button>
      </div>
    </form>

    <section class="upload" id="upload" hidden aria-live="polite" aria-labelledby="upload-title">
      <div class="upload-head">
        <span class="upload-mark" id="upload-mark" aria-hidden="true"></span>
        <span class="upload-title" id="upload-title"></span>
      </div>
      <div class="upload-name" id="upload-name"></div>
      <div class="upload-track" id="upload-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span class="upload-fill" id="upload-fill"></span></div>
      <div class="upload-line" id="upload-line"></div>
      <button type="button" class="key wide" id="upload-button"></button>
    </section>
    <input type="file" id="file-input" hidden />

    <!-- Au menu et pendant une partie, la barre des vues en bas : Écran (les entrées de l'écran ouvert à
         la borne), Menus (tous les menus), Communauté (messages, amis, scores), Boutons (ceux de la
         borne). body[data-view]. Au navigateur, la barre d'outils (Retour, Avancer, Clavier, Plus, Fermer). -->
    <!-- Mini-lecteur du Juke-box, au-dessus des onglets, dès qu'un morceau joue : il ouvre le lecteur. -->
    <div class="jb-mini" id="jb-mini">
      <button type="button" class="jb-mini-open" id="jb-mini-open">
        <span class="jb-mini-cover" id="jb-mini-cover"></span>
        <span class="jb-mini-text"><span class="jb-mini-title" id="jb-mini-title"></span><span class="jb-mini-label" id="jb-mini-label"></span></span>
      </button>
      <button type="button" class="jb-mini-btn" id="jb-mini-pause"></button>
      <button type="button" class="jb-mini-btn" id="jb-mini-next"></button>
      <span class="jb-mini-bar" id="jb-mini-bar"></span>
    </div>
    <nav class="views" id="views" role="tablist">
      <button type="button" class="view-tab" id="tab-list" role="tab" data-view="list" aria-controls="entries"></button>
      <button type="button" class="view-tab" id="tab-menus" role="tab" data-view="menus" aria-controls="menus"></button>
      <button type="button" class="view-tab" id="tab-jukebox" role="tab" data-view="jukebox" aria-controls="jukebox"></button>
      <button type="button" class="view-tab" id="tab-community" role="tab" data-view="community" aria-controls="community"></button>
      <button type="button" class="view-tab" id="tab-buttons" role="tab" data-view="buttons" aria-controls="buttons"></button>
    </nav>

    <nav class="tools" id="tools">
      <button type="button" class="tool" id="nav-back"></button>
      <button type="button" class="tool" id="nav-forward"></button>
      <button type="button" class="tool" id="nav-keyboard" aria-controls="keys"></button>
      <button type="button" class="tool" id="nav-send"></button>
      <button type="button" class="tool" id="nav-more" aria-controls="sheet" aria-haspopup="dialog"></button>
      <button type="button" class="tool danger" id="nav-close"></button>
    </nav>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-title" id="sheet-title"></div>
        <div class="sheet-text" id="sheet-text" hidden></div>
        <div class="engines" id="sheet-engines" role="radiogroup" hidden></div>
        <form class="sheet-search" id="sheet-search" hidden>
          <input id="search-query" type="search" autocomplete="off" enterkeyhint="search" />
          <button type="submit" class="key primary" data-i18n>Chercher</button>
        </form>
        <div class="sheet-actions" id="sheet-actions"></div>
        <button type="button" class="key wide" id="sheet-cancel" data-i18n>Annuler</button>
      </div>
    </div>

    <script src="catalogue.js"></script>
    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="avatar.js"></script>
    <script src="telephone-core.js"></script>
    <script src="telephone-ranks.js"></script>
    <script src="telephone-community.js"></script>
    <script src="telephone-jukebox.js"></script>
    <script src="telephone.js"></script>
  </body>
</html>
