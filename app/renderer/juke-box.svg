<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Logo du Juke-box de Cyber Pinball (piste « Sillon », 10/11/2026) : vinyle sarcelle et métal patiné
       éclairés d'en haut à gauche, six pistes de son violettes hors du label, deux croches liées vert
       signal centrées sur leur centre de masse visuel (pas sur leur boîte). -->
  <defs>
    <radialGradient id="jba-disc" cx="30%" cy="24%" r="82%"><stop stop-color="#173c3c"/><stop offset="1" stop-color="#06100f"/></radialGradient>
    <linearGradient id="jba-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0d6cb"/><stop offset=".38" stop-color="#8ba69e"/><stop offset="1" stop-color="#506e67"/></linearGradient>
    <linearGradient id="jba-label" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13322e"/><stop offset="1" stop-color="#06100f"/></linearGradient>
  </defs>
  <circle cx="150" cy="150" r="147" fill="url(#jba-disc)" stroke="url(#jba-metal)" stroke-width="6"/>
  <g fill="none" stroke="#719b9b"><circle cx="150" cy="150" r="134" opacity=".42"/><circle cx="150" cy="150" r="124" opacity=".26"/><circle cx="150" cy="150" r="114" opacity=".19"/></g>
  <path d="M51.7 68.7A127.5 127.5 0 0 1 172.1 24.4" stroke="#c0d6cb" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".83"/>
  <path d="M45 137v26m18-45v64m18-77v90m138-90v90m18-77v64m18-45v26" fill="none" stroke="#aa84dc" stroke-width="9" stroke-linecap="round"/>
  <circle cx="150" cy="150" r="57" fill="url(#jba-label)" stroke="#35c8bd" stroke-width="3.5"/>
  <!-- Ellipses identiques, hampes espacées de 41 ; centre de masse corrigé (-8, +7). -->
  <g fill="#8be23a" transform="translate(-8 7)">
    <path d="M137 111 186 99V166H178V121L145 129V176H137Z"/>
    <ellipse cx="132" cy="176" rx="15" ry="10" transform="rotate(-20 132 176)"/>
    <ellipse cx="173" cy="166" rx="15" ry="10" transform="rotate(-20 173 166)"/>
  </g>
</svg>
