<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030807" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <!-- Raccourci de l'écran d'accueil : l'adresse avec la clé (#g=…). Pas de manifeste : son adresse
         de départ perdrait la clé, que la page ne garde jamais dans son stockage. -->
    <meta name="apple-mobile-web-app-title" content="Cyber Pinball" />
    <meta name="application-name" content="Cyber Pinball" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icone-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <title>Cyber Pinball</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <!-- Page du raccourci qui suit la borne (page.js) : elle retrouve la borne et y renvoie le téléphone. -->
  <body data-busy="1">
    <main>
      <img class="mark" src="/icone-192.png" alt="" width="72" height="72" />
      <h1 id="title">Cyber Pinball</h1>
      <p id="text"></p>
      <div id="actions"></div>
    </main>
    <script src="/telephone-core.js"></script>
    <script src="/page.js"></script>
  </body>
</html>
